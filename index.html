<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conspiracy Board</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="panel">
      <header class="heading">
        <div class="eyebrow">CASE FILE // 01</div>
        <h1>Conspiracy board</h1>
        <p>Pin the evidence. Connect the dots.</p>
      </header>

      <section class="tool-guide" aria-label="How to use the board">
        <div class="guide-row">
          <span class="tool-icon pin-icon" aria-hidden="true">●</span>
          <div><strong>Place a pin</strong><span>Choose Pin in Owlbear's toolbar, then click the map.</span></div>
        </div>
        <div class="guide-row">
          <span class="tool-icon string-icon" aria-hidden="true">↗</span>
          <div><strong>Draw string</strong><span>Choose String, then drag across the map to connect evidence.</span></div>
        </div>
      </section>

      <footer><span class="status-dot"></span><span id="status" role="status">Ready to investigate</span></footer>
    </main>
  </body>
</html>
